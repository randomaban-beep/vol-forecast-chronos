[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-forecast-chronos"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "pyarrow==23.0.1", "PyYAML==6.0.3", "scipy==1.17.1", "arch==7.2.0", "numba==0.61.2", "llvmlite==0.44.0", "statsmodels==0.15.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
zero-shot = ["chronos-forecasting==1.5.3", "torch==2.6.0", "transformers==4.48.3", "accelerate==1.3.0", "huggingface-hub==0.28.1", "tokenizers==0.21.0", "safetensors==0.5.2"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
