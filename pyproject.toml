[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-forecast-chronos"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "pyarrow==23.0.1", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
